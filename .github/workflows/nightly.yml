# =============================================================================
# E2E Tests — Nightly Regression
# =============================================================================
#
# Full cross-browser regression: Chromium, Firefox, Mobile Chrome, Mobile Safari.
# Runs on schedule (every night at 2:00 AM UTC) and on manual trigger.
# Always runs all 4 browsers — for targeted single-browser runs use e2e.yml.
#
# This catches browser-specific bugs that the fast PR pipeline (Chromium-only)
# would miss: WebKit rendering differences, Firefox event handling quirks,
# mobile viewport issues, touch event problems.
#
# Allure report identification:
#   Reports are identified by a UTC timestamp (YYYYMMDD_HHMMSS) generated
#   exactly once in the `setup` job and propagated to all matrix jobs and the
#   publish stage via `needs.setup.outputs.run-id`. This is essential for the
#   matrix: without a shared identifier, each parallel job would compute its
#   own timestamp, producing four mismatched folders for the same nightly run.
#
# Multi-environment support via prefixed secrets — same approach as e2e.yml.
# See e2e.yml for full explanation of the multi-env architecture.

name: Nightly Regression

on:
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:
    inputs:
      grep:
        description: 'Filter tests by tag (e.g. @smoke, @auth)'
        required: false
        default: ''
      environment:
        description: 'Target environment'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production

jobs:
  # Generate a single shared run identifier for this nightly execution.
  # All 4 matrix jobs (chromium/firefox/mobile-chrome/mobile-safari) and all
  # 4 publish jobs read it via `needs.setup.outputs.run-id`. This guarantees
  # the same folder name across browsers — without it, parallel `date` calls
  # in each matrix job would drift by seconds and break the cross-browser
  # navigation in the gh-pages index.
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.run-id.outputs.run-id }}
    steps:
      - name: Generate run ID
        id: run-id
        run: echo "run-id=$(date -u +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT

  nightly:
    name: E2E ${{ matrix.project }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, mobile-chrome, mobile-safari]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Read environment-specific secrets based on the selected environment.
      # Dev secrets have no prefix (backwards compatible with existing setup).
      # Staging and production secrets use STAGING_* and PROD_* prefixes.
      # BASE_URL is environment-specific — points to the correct deploy target.
      - name: Set environment secrets
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          if [ "$ENV" = "dev" ]; then
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> $GITHUB_ENV
            echo "TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }}" >> $GITHUB_ENV
            echo "TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}" >> $GITHUB_ENV
            echo "TEST_USER_USERNAME=${{ secrets.TEST_USER_USERNAME }}" >> $GITHUB_ENV
            echo "BASE_URL=http://localhost:3000" >> $GITHUB_ENV
          elif [ "$ENV" = "staging" ]; then
            echo "JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}" >> $GITHUB_ENV
            echo "TEST_USER_EMAIL=${{ secrets.STAGING_TEST_USER_EMAIL }}" >> $GITHUB_ENV
            echo "TEST_USER_PASSWORD=${{ secrets.STAGING_TEST_USER_PASSWORD }}" >> $GITHUB_ENV
            echo "TEST_USER_USERNAME=${{ secrets.STAGING_TEST_USER_USERNAME }}" >> $GITHUB_ENV
            echo "BASE_URL=${{ secrets.STAGING_BASE_URL }}" >> $GITHUB_ENV
          elif [ "$ENV" = "production" ]; then
            echo "JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}" >> $GITHUB_ENV
            echo "TEST_USER_EMAIL=${{ secrets.PROD_TEST_USER_EMAIL }}" >> $GITHUB_ENV
            echo "TEST_USER_PASSWORD=${{ secrets.PROD_TEST_USER_PASSWORD }}" >> $GITHUB_ENV
            echo "TEST_USER_USERNAME=${{ secrets.PROD_TEST_USER_USERNAME }}" >> $GITHUB_ENV
            echo "BASE_URL=${{ secrets.PROD_BASE_URL }}" >> $GITHUB_ENV
          fi

      - name: Set static environment variables
        run: |
          echo "CI=true" >> $GITHUB_ENV
          echo "DATABASE_URL=file:./database.sqlite" >> $GITHUB_ENV
          echo "TEST_DATABASE_URL=file:./test.sqlite" >> $GITHUB_ENV

      - name: Type check
        run: npm run type:check

      - name: Lint
        run: npm run lint:tests

      # Install only the browser needed for this matrix job.
      # mobile-chrome uses Chromium engine, mobile-safari uses WebKit.
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project == 'mobile-safari' && 'webkit' || matrix.project }}

      - name: Run E2E tests
        run: |
          npx playwright test \
          --project=${{ matrix.project }} \
          --workers=${{ (matrix.project == 'firefox' || matrix.project == 'mobile-safari') && '1' || '2' }} \
          ${{ github.event.inputs.grep && format('--grep "{0}"', github.event.inputs.grep) || '' }}

      # Create Allure executor info — populates EXECUTORS section in report.
      # Shows which CI run produced this report with a direct link to the run.
      # - buildOrder uses `github.run_id` (globally unique across all workflows
      #   and monotonically increasing) so Allure's trend chart sorts e2e.yml
      #   and nightly.yml runs into a single coherent timeline.
      # - reportUrl uses the shared run-id timestamp for the gh-pages path.
      - name: Create Allure executor info
        if: always()
        run: |
          RUN_ID="${{ needs.setup.outputs.run-id }}"
          mkdir -p allure-results
          cat > allure-results/executor.json << EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": ${{ github.run_id }},
            "buildName": "Run ${RUN_ID} — ${{ matrix.project }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://chamleck.github.io/realworld-playwright-demo/${{ matrix.project }}/runs/${RUN_ID}/",
            "reportName": "Allure Report"
          }
          EOF

      # Create Allure environment properties — populates ENVIRONMENT section.
      # Shows key facts about the test run for stakeholders.
      - name: Create Allure environment properties
        if: always()
        run: |
          mkdir -p allure-results
          cat > allure-results/environment.properties << EOF
          Browser=${{ matrix.project }}
          Base URL=${{ env.BASE_URL }}
          Target environment=${{ github.event.inputs.environment || 'dev' }}
          Branch=${{ github.ref_name }}
          Commit=${{ github.sha }}
          Run ID=${{ needs.setup.outputs.run-id }}
          GitHub run=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      # Generate Allure report — ALLURE_BROWSER tells allurerc.mjs which
      # history file to use: allure-history/{browser}.jsonl
      - name: Generate Allure report
        if: always()
        env:
          ALLURE_BROWSER: ${{ matrix.project }}
        run: npm run allure:generate

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-${{ matrix.project }}
          path: allure-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots, videos)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  # Publish per-browser Allure reports to GitHub Pages sequentially.
  # max-parallel: 1 ensures browsers publish one at a time — prevents
  # git push conflicts on gh-pages branch.
  # Each browser/device gets its own report URL: /{browser}/runs/{run-id}/
  # `github.run_attempt == 1` guards against re-runs creating duplicate
  # folders with new timestamps for the same logical nightly execution.
  publish:
    name: Publish — ${{ matrix.project }}
    needs: [setup, nightly]
    if: always() && github.run_attempt == 1
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project: [chromium, firefox, mobile-chrome, mobile-safari]
    uses: ./.github/workflows/pages.yml
    with:
      browser: ${{ matrix.project }}
      run-id: ${{ needs.setup.outputs.run-id }}
      artifact-name: allure-results-${{ matrix.project }}
    permissions:
      contents: write
      pages: write