# =============================================================================
# Allure Report — GitHub Pages Publisher (Reusable Workflow)
# =============================================================================
#
# Publishes a per-run Allure report to GitHub Pages under:
#   {browser}/runs/{run-id}/
#
# `run-id` is a UTC timestamp in the format YYYYMMDD_HHMMSS, generated once
# by the calling workflow's `setup` job. Using a timestamp instead of
# `github.run_number` solves two problems:
#   1. e2e.yml and nightly.yml have independent `run_number` counters but
#      publish into the same gh-pages namespace — collisions and overwrites
#      were inevitable.
#   2. Per-browser retention (sort -n on numeric folder names) treated re-runs
#      and out-of-order numbers as "old" and silently deleted just-deployed
#      reports.
# Timestamps are monotonic in time, so lexicographic sort gives chronological
# order, and a new run is always the "newest" entry by definition.
#
# History is preserved per browser/device project:
#   {browser}/allure-history.jsonl
#
# Called by e2e.yml (browser=chromium) and nightly.yml (browser=matrix.project).
#
# gh-pages structure:
#   chromium/allure-history.jsonl
#   chromium/runs/20260612_193001/
#   chromium/runs/20260611_193215/
#   firefox/allure-history.jsonl
#   firefox/runs/20260612_193001/
#   ...
#   index.html  ← auto-generated navigation page

name: Allure Report — GitHub Pages

on:
  workflow_call:
    inputs:
      browser:
        description: 'Browser/device project (chromium, firefox, mobile-chrome, mobile-safari)'
        required: true
        type: string
      run-id:
        description: 'Shared run identifier (UTC timestamp YYYYMMDD_HHMMSS) from the calling workflow''s setup job'
        required: true
        type: string
      artifact-name:
        description: 'Name of the allure-results artifact to download'
        required: true
        type: string
      retention:
        description: 'Number of runs to keep per browser (older runs are deleted)'
        required: false
        type: number
        default: 20

jobs:
  publish:
    name: Publish — ${{ inputs.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Download allure-results artifact from the calling workflow run
      - name: Download allure-results artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: allure-results/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Restore per-browser history from gh-pages for trend data.
      # On first run, gh-pages or history file may not exist — skipped gracefully.
      - name: Restore Allure history from gh-pages
        continue-on-error: true
        run: |
          git fetch origin gh-pages --depth=1
          mkdir -p allure-history
          git checkout origin/gh-pages -- ${{ inputs.browser }}/allure-history.jsonl 2>/dev/null || true
          cp ${{ inputs.browser }}/allure-history.jsonl allure-history/${{ inputs.browser }}.jsonl 2>/dev/null || true

      # Generate Allure report with browser-specific history
      - name: Generate Allure report
        env:
          ALLURE_BROWSER: ${{ inputs.browser }}
        run: npm run allure:generate

      # Generate index.html — navigation page listing all browsers and their runs.
      # Each run is rendered with its timestamp formatted as a human-readable
      # UTC datetime (e.g. "2026-06-12 19:30:01 UTC").
      - name: Generate index.html
        run: |
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>RealWorld Playwright Demo — Allure Reports</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #333; }
              h1 { color: #1a1a2e; border-bottom: 2px solid #e8e8e8; padding-bottom: 10px; }
              h2 { color: #16213e; margin-top: 30px; }
              .runs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
              .run { background: #f8f9fa; border: 1px solid #e8e8e8; border-radius: 6px; padding: 12px; text-decoration: none; color: #333; transition: all 0.2s; }
              .run:hover { background: #e8f4fd; border-color: #4a90d9; }
              .run-label { font-weight: 600; font-size: 0.95em; font-variant-numeric: tabular-nums; }
              .run-meta { font-size: 0.8em; color: #777; margin-top: 4px; }
            </style>
          </head>
          <body>
            <h1>🎭 RealWorld Playwright Demo</h1>
            <p>Allure test reports per browser/device. Latest runs shown first.</p>
            <script>
              const BASE = 'https://chamleck.github.io/realworld-playwright-demo';
              const browsers = ['chromium', 'firefox', 'mobile-chrome', 'mobile-safari'];
              const labels = {
                'chromium': '🖥️ Chromium (Desktop)',
                'firefox': '🦊 Firefox (Desktop)',
                'mobile-chrome': '📱 Mobile Chrome (Pixel 7)',
                'mobile-safari': '🍎 Mobile Safari (iPhone 13)'
              };

              // run-id format: YYYYMMDD_HHMMSS (UTC).
              // Renders as "YYYY-MM-DD HH:MM UTC" for readability — seconds omitted
              // since they rarely matter to a human scanning the list.
              function formatRunId(runId) {
                const m = String(runId).match(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})$/);
                if (!m) return runId;
                return `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]} UTC`;
              }

              document.addEventListener('DOMContentLoaded', async () => {
                const main = document.querySelector('body');
                for (const browser of browsers) {
                  try {
                    const res = await fetch(`${BASE}/${browser}/runs/index.json`);
                    if (!res.ok) continue;
                    const runs = await res.json();
                    const section = document.createElement('section');
                    section.innerHTML = `<h2>${labels[browser] || browser}</h2><div class="runs">${
                      runs.slice().reverse().map(r => `<a class="run" href="${BASE}/${browser}/runs/${r}/"><div class="run-label">${formatRunId(r)}</div><div class="run-meta">${r}</div></a>`).join('')
                    }</div>`;
                    main.appendChild(section);
                  } catch(e) {}
                }
              });
            </script>
          </body>
          </html>
          EOF

      # Deploy to gh-pages using git directly:
      # 1. Clone gh-pages into a temp directory
      # 2. Add new report under {browser}/runs/{run-id}/
      # 3. Apply retention — git rm oldest runs (timestamps sort chronologically)
      # 4. Update history, index.html, runs index
      # 5. Push with retry on conflict
      - name: Deploy to GitHub Pages
        run: |
          # Clone gh-pages branch
          git clone --depth=1 --branch gh-pages \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            gh-pages-dir 2>/dev/null || {
            # gh-pages doesn't exist yet — create empty dir
            mkdir gh-pages-dir
            cd gh-pages-dir
            git init
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git checkout --orphan gh-pages
            cd ..
          }

          cd gh-pages-dir

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          BROWSER='${{ inputs.browser }}'
          RUN_ID='${{ inputs.run-id }}'

          # Add new report
          mkdir -p "$BROWSER/runs/$RUN_ID"
          cp -r ../allure-report/. "$BROWSER/runs/$RUN_ID/"

          # Update per-browser history
          mkdir -p "$BROWSER"
          cp "../allure-history/$BROWSER.jsonl" "$BROWSER/allure-history.jsonl" 2>/dev/null || true

          # Apply retention policy — git rm oldest runs.
          # Regex matches the timestamp format exactly (^[0-9]{8}_[0-9]{6}$) so
          # any unrelated files or legacy numeric folders are ignored, not
          # counted toward the limit, and never deleted by this step.
          # Lexicographic sort on YYYYMMDD_HHMMSS gives chronological order.
          RUNS=$(ls "$BROWSER/runs/" 2>/dev/null | grep -E '^[0-9]{8}_[0-9]{6}$' | sort || true)
          TOTAL=$(echo "$RUNS" | grep -c '_' || true)
          RETENTION=${{ inputs.retention }}
          if [ "$TOTAL" -gt "$RETENTION" ]; then
            TO_DELETE=$(echo "$RUNS" | head -n $(($TOTAL - $RETENTION)))
            for RUN in $TO_DELETE; do
              echo "Removing old run: $BROWSER/runs/$RUN"
              git rm -rf "$BROWSER/runs/$RUN" 2>/dev/null || rm -rf "$BROWSER/runs/$RUN"
            done
          fi

          # Update runs index.json — array of timestamp strings (quoted), sorted
          # oldest-first. index.html reverses for "newest first" display.
          CURRENT_RUNS=$(ls "$BROWSER/runs/" 2>/dev/null \
            | grep -E '^[0-9]{8}_[0-9]{6}$' \
            | sort \
            | awk 'NR>1 {printf ", "} {printf "\"%s\"", $0}')
          echo "[$CURRENT_RUNS]" > "$BROWSER/runs/index.json"

          # Update index.html
          cp ../index.html index.html

          # Commit and push with retry on conflict
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "ci: publish $BROWSER report — run $RUN_ID"

          MAX_RETRIES=3
          RETRY=0
          until git push origin gh-pages; do
            RETRY=$((RETRY+1))
            if [ $RETRY -ge $MAX_RETRIES ]; then
              echo "Push failed after $MAX_RETRIES retries"
              exit 1
            fi
            echo "Push failed, retry $RETRY/$MAX_RETRIES..."
            git pull --rebase origin gh-pages
            sleep $((RETRY * 2))
          done

      # Update Summary with direct link to this run's report
      - name: Publish report summary
        run: |
          REPORT_URL="https://chamleck.github.io/realworld-playwright-demo/${{ inputs.browser }}/runs/${{ inputs.run-id }}/"
          echo "## 📊 Allure Report — ${{ inputs.browser }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** \`${{ inputs.run-id }}\` (UTC)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Open report]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY