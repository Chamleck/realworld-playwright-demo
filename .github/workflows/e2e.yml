# =============================================================================
# E2E Tests — PR Pipeline
# =============================================================================
#
# Fast feedback on every push and pull request.
# Defaults to Chromium to keep the pipeline under 5 minutes.
# A specific browser can be selected via workflow_dispatch for targeted debugging.
# Full cross-browser regression runs nightly — see nightly.yml.
#
# Allure report identification:
#   Reports are identified by a UTC timestamp (YYYYMMDD_HHMMSS) generated
#   exactly once in the `setup` job and propagated to all downstream jobs
#   via `needs.setup.outputs.run-id`. This avoids the rendering of
#   `github.run_number`, which is workflow-scoped (e2e.yml and nightly.yml
#   have independent counters) and therefore unsafe as a shared identifier
#   for reports published into the same gh-pages namespace.
#
# Multi-environment support via prefixed secrets:
#   GitHub Environments are paid for private repos — instead we use prefixed
#   secrets in shared space (STAGING_JWT_SECRET, PROD_JWT_SECRET, etc.) with
#   a workflow_dispatch `environment` input (dev / staging / production).
#   The workflow reads the correct prefix and substitutes the right secrets.
#   To add a new environment: add prefixed secrets to GitHub repo settings
#   and extend the "Set environment secrets" step below.

name: E2E Tests

on:
  push:
    branches: [setup/playwright, tests/e2e-suite, dev, main]
  pull_request:
    branches: [main, dev]

  workflow_dispatch:
    inputs:
      grep:
        description: 'Filter tests by tag (e.g. @smoke, @auth, @articles)'
        required: false
        default: ''
      environment:
        description: 'Target environment'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      project:
        description: 'Browser project (default: chromium)'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - mobile-chrome
          - mobile-safari

# Cancel previous runs for the same branch/PR — saves runner minutes
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Generate a single shared run identifier for this workflow run.
  # All downstream jobs (e2e, publish) read it via `needs.setup.outputs.run-id`,
  # guaranteeing identical paths in Allure metadata and the gh-pages folder
  # name. Done in a dedicated job so the value survives even if `e2e` fails
  # early — `publish` (with `if: always()`) still has access to it.
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.run-id.outputs.run-id }}
    steps:
      - name: Generate run ID
        id: run-id
        run: echo "run-id=$(date -u +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT

  e2e:
    name: E2E ${{ github.event.inputs.project || 'chromium' }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Read environment-specific secrets based on the selected environment.
      # Dev secrets have no prefix (backwards compatible with existing setup).
      # Staging and production secrets use STAGING_* and PROD_* prefixes.
      # BASE_URL is environment-specific — points to the correct deploy target.
      - name: Set environment secrets
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          if [ "$ENV" = "dev" ]; then
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> $GITHUB_ENV
            echo "TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }}" >> $GITHUB_ENV
            echo "TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}" >> $GITHUB_ENV
            echo "TEST_USER_USERNAME=${{ secrets.TEST_USER_USERNAME }}" >> $GITHUB_ENV
            echo "BASE_URL=http://localhost:3000" >> $GITHUB_ENV
          elif [ "$ENV" = "staging" ]; then
            echo "JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}" >> $GITHUB_ENV
            echo "TEST_USER_EMAIL=${{ secrets.STAGING_TEST_USER_EMAIL }}" >> $GITHUB_ENV
            echo "TEST_USER_PASSWORD=${{ secrets.STAGING_TEST_USER_PASSWORD }}" >> $GITHUB_ENV
            echo "TEST_USER_USERNAME=${{ secrets.STAGING_TEST_USER_USERNAME }}" >> $GITHUB_ENV
            echo "BASE_URL=${{ secrets.STAGING_BASE_URL }}" >> $GITHUB_ENV
          elif [ "$ENV" = "production" ]; then
            echo "JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}" >> $GITHUB_ENV
            echo "TEST_USER_EMAIL=${{ secrets.PROD_TEST_USER_EMAIL }}" >> $GITHUB_ENV
            echo "TEST_USER_PASSWORD=${{ secrets.PROD_TEST_USER_PASSWORD }}" >> $GITHUB_ENV
            echo "TEST_USER_USERNAME=${{ secrets.PROD_TEST_USER_USERNAME }}" >> $GITHUB_ENV
            echo "BASE_URL=${{ secrets.PROD_BASE_URL }}" >> $GITHUB_ENV
          fi

      - name: Set static environment variables
        run: |
          echo "CI=true" >> $GITHUB_ENV
          echo "DATABASE_URL=file:./database.sqlite" >> $GITHUB_ENV
          echo "TEST_DATABASE_URL=file:./test.sqlite" >> $GITHUB_ENV

      - name: Type check
        run: npm run type:check

      - name: Lint
        run: npm run lint:tests

      # Install only the browser needed for this run.
      # mobile-chrome uses Chromium engine, mobile-safari uses WebKit.
      - name: Install Playwright browser
        run: |
          PROJECT="${{ github.event.inputs.project || 'chromium' }}"
          if [ "$PROJECT" = "mobile-chrome" ]; then
            npx playwright install --with-deps chromium
          elif [ "$PROJECT" = "mobile-safari" ]; then
            npx playwright install --with-deps webkit
          else
            npx playwright install --with-deps $PROJECT
          fi

      - name: Run E2E tests
        run: |
          npx playwright test \
          --project=${{ github.event.inputs.project || 'chromium' }} \
          ${{ github.event.inputs.grep && format('--grep "{0}"', github.event.inputs.grep) || '' }}

      # Create Allure executor info — populates EXECUTORS section in report.
      # Shows which CI run produced this report with a direct link to the run.
      # - buildOrder uses `github.run_id` (globally unique across all workflows
      #   and monotonically increasing) so Allure's trend chart sorts e2e.yml
      #   and nightly.yml runs into a single coherent timeline.
      # - reportUrl uses the shared run-id timestamp for the gh-pages path.
      - name: Create Allure executor info
        if: always()
        run: |
          PROJECT="${{ github.event.inputs.project || 'chromium' }}"
          RUN_ID="${{ needs.setup.outputs.run-id }}"
          mkdir -p allure-results
          cat > allure-results/executor.json << EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": ${{ github.run_id }},
            "buildName": "Run ${RUN_ID} — ${PROJECT}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://chamleck.github.io/realworld-playwright-demo/${PROJECT}/runs/${RUN_ID}/",
            "reportName": "Allure Report"
          }
          EOF

      # Create Allure environment properties — populates ENVIRONMENT section.
      # Shows key facts about the test run for stakeholders.
      - name: Create Allure environment properties
        if: always()
        run: |
          PROJECT="${{ github.event.inputs.project || 'chromium' }}"
          mkdir -p allure-results
          cat > allure-results/environment.properties << EOF
          Browser=${PROJECT}
          Base URL=${{ env.BASE_URL }}
          Target environment=${{ github.event.inputs.environment || 'dev' }}
          Branch=${{ github.ref_name }}
          Commit=${{ github.sha }}
          Run ID=${{ needs.setup.outputs.run-id }}
          GitHub run=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      # Generate Allure report — ALLURE_BROWSER tells allurerc.mjs which
      # history file to use: allure-history/{browser}.jsonl
      - name: Generate Allure report
        if: always()
        env:
          ALLURE_BROWSER: ${{ github.event.inputs.project || 'chromium' }}
        run: npm run allure:generate

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots, videos)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # Publish Allure report to GitHub Pages after tests complete.
  # Report is published to: /{browser}/runs/{run-id}/
  # History is preserved per browser for trend analysis.
  # `github.run_attempt == 1` guards against re-runs overwriting historical
  # reports: a re-run would generate a new timestamp and create a duplicate
  # folder for the same logical CI execution.
  publish:
    name: Publish Allure Report
    needs: [setup, e2e]
    if: always() && github.run_attempt == 1
    uses: ./.github/workflows/pages.yml
    with:
      browser: ${{ github.event.inputs.project || 'chromium' }}
      run-id: ${{ needs.setup.outputs.run-id }}
      artifact-name: allure-results
    permissions:
      contents: write
      pages: write